<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acceso — GeoVisor Carmen de Apicalá</title>
  <link rel="stylesheet" href="src/auth/login.css" />
</head>
<body>
  <div class="login-card">

    <!-- Logo CTGlobal -->
    <div class="login-logo">
      <svg viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="28" cy="28" r="26" fill="#0f3460"/>
        <path d="M28 10C18.06 10 10 18.06 10 28s8.06 18 18 18 18-8.06 18-18S37.94 10 28 10z" fill="#fff" opacity=".12"/>
        <circle cx="28" cy="28" r="8" fill="none" stroke="#16a085" stroke-width="2.5"/>
        <line x1="28" y1="10" x2="28" y2="46" stroke="#16a085" stroke-width="1.5"/>
        <line x1="10" y1="28" x2="46" y2="28" stroke="#16a085" stroke-width="1.5"/>
        <ellipse cx="28" cy="28" rx="12" ry="18" fill="none" stroke="#fff" stroke-width="1.2" opacity=".4"/>
      </svg>
    </div>

    <h1 class="login-title">GeoVisor</h1>
    <p class="login-subtitle">Carmen de Apicalá — Plan EOT</p>

    <form id="loginForm" novalidate>

      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input id="email" name="email" type="email" class="form-input"
               placeholder="usuario@correo.com"
               autocomplete="username" required />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="input-wrap">
          <input id="password" name="password" type="password" class="form-input"
                 placeholder="••••••••"
                 autocomplete="current-password" required />
          <button type="button" id="togglePwd" class="toggle-pwd" aria-label="Ver contraseña">👁</button>
        </div>
      </div>

      <div id="loginError" class="login-error" hidden></div>

      <button type="submit" id="btnLogin" class="btn-login">
        <span id="btnLoginText">Ingresar</span>
        <span id="btnLoginSpinner" class="spinner" hidden></span>
      </button>

    </form>

    <p class="login-footer">
      <strong>CTGlobal</strong> — Conexión Territorial Global SAS &nbsp;|&nbsp; GV-002
    </p>
  </div>

  <script type="module" src="src/auth/login.js"></script>
</body>
</html>
